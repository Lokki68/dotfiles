set -g default-shell /usr/bin/fish

set -g @plugin ".tmux/plugins/tpm"
set -g @plugin ".tmux/plugins/tpm-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin 'tmux-plugins/tmux-resurect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'

run '~/.tmux/plugins/tpm/tpm'

set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1 

bind £ move-window -r

unbind r
bind r source-file ~/.tmux.conf

set-option -g mouse on

set-option -g history-limit 100000

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

bind c new-window -c "#{pane_current_path}"

bind -n M-H previous-window
bind -n M-L next-window

unbind %
bind | split-window -h  -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

set-option -s focus-events on
set-option -s extended-keys on
set-option -s escape-time 0

##
# Styling
###

# Transparence globale
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'
set -g pane-border-style 'fg=color238,bg=default'
set -g pane-active-border-style 'fg=color51,bg=default'

# Status bar transparent
set -g status-style 'bg=default'
set -g status-left-style 'bg=default'
set -g status-right-style 'bg=default'
set -g message-style 'bg=default'


# Set status position to the top
# set-option -g status-position top

